<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School HQ</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9edf6;background:#0d111b;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1b263d 0%,#0d111b 65%);padding:44px 16px}
.app{max-width:600px;margin:auto;background:#151c2b;border:1px solid #303a4f;border-radius:22px;padding:25px;box-shadow:0 18px 70px #0005}
header,.nav,.row,.task-head,.foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}.logo{font-size:27px;background:#273650;border-radius:12px;padding:10px}
h1{font-size:23px;margin:0}p{margin:4px 0;color:#9aa8c0;font-size:13px}.pill{border:1px solid #3a465e;border-radius:30px;padding:6px 10px;color:#b5c2d8;font-size:11px}
.nav{margin:28px 0 20px}.tabs{display:flex;gap:5px}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:#273249;color:#dce6f5;font-weight:600;font-size:13px}
button:hover{background:#354461}button.active,button.primary{background:#e5edff;color:#152238}button.primary:hover,button.active:hover{background:#cbd9ff}button.outline{border:1px solid #43506a;background:transparent}
h2{font-size:15px;margin:0 0 15px}.count{font-size:12px;color:#91a1ba}.section-head{display:flex;justify-content:space-between;align-items:center}
.task{border:1px solid #354158;border-radius:13px;margin:11px 0;overflow:hidden;background:#192234}
.task-button{width:100%;text-align:left;background:transparent;padding:17px;border-radius:0;font-weight:400}.task-button:hover{background:#202c42}
.task-title{font-size:15px;font-weight:650;margin-top:9px;line-height:1.4}.meta{display:flex;align-items:center;gap:9px;font-size:12px;color:#a9b7cd}
.due-overdue{color:#ff9292;font-weight:750}.due-today{color:#ffcf80;font-weight:750}.subject{display:inline-block;background:#30415d;border-radius:6px;padding:4px 8px;color:#dce8ff;font-weight:650;font-size:11px}
.chevron{color:#91a2bb;font-size:18px}.details{padding:0 16px 16px}.action{background:#111827;border-radius:10px;padding:14px;margin:0 0 12px}.action-label{font-size:10px;letter-spacing:.09em;color:#91a2bb;font-weight:750}.action-text{font-size:14px;margin-top:7px;line-height:1.5}
.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{flex:1}.confirm{border:1px solid #52647f;border-radius:10px;padding:12px;margin-top:10px}.confirm p{margin-bottom:12px;color:#e9edf6}
label{font-size:12px;color:#c4d1e4;font-weight:650;display:block;margin:17px 0 7px}input,select,textarea{width:100%;border:1px solid #40506b;border-radius:9px;padding:12px;background:#0f1725;color:#f1f5fc;font:inherit;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#8aaaf0}textarea{min-height:80px;resize:vertical}
.inline{display:flex;gap:8px}.inline input{flex:1;min-width:0}.inline button{white-space:nowrap}.seg{display:flex;gap:8px}.seg button{flex:1}
.save{width:100%;margin-top:20px}.empty{text-align:center;padding:38px 12px;color:#a8b8d0}.empty b{display:block;margin-bottom:6px;color:#edf2ff}
.notice{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#26334b;padding:8px 10px;border-radius:10px;margin-bottom:12px;font-size:12px}
footer{border-top:1px solid #344158;margin-top:22px;padding-top:15px;color:#8394af;font-size:11px;display:flex;justify-content:space-between}
.hidden{display:none!important}.error{color:#ffb3b3;font-size:12px;margin-top:8px}
@media(max-width:460px){body{padding:12px}.app{padding:16px}.pill{display:none}.nav{gap:5px}.nav button{padding:9px;font-size:12px}}
.calendar{margin-top:10px;background:#101827;border:1px solid #3a4962;border-radius:12px;padding:13px}.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cal-top button{font-size:21px;padding:4px 14px}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.cal-grid button{padding:10px 0;background:transparent;font-size:12px}.cal-grid button:hover{background:#344461}.cal-grid button.selected{background:#e5edff;color:#152238}.cal-weekday{font-size:11px;color:#9caec9;padding:7px 0}.chosen-date{color:#a8bad3;font-size:12px;text-align:center;margin-top:10px}.due-overdue{color:#ff9b9b;font-weight:700}.due-today{color:#f5d28d;font-weight:700}
</style></head><body>
<main class="app">
<header><div class="brand"><div class="logo">🎓</div><div><h1>School HQ</h1><p>Homework command center</p></div></div><span class="pill">Your workspace</span></header>
<nav class="nav"><div class="tabs"><button id="todoTab" class="active" data-view="todo">To-do (0)</button><button id="archiveTab" data-view="archive">Archive</button></div><button id="addTab" class="outline" data-view="add">＋ Add task</button></nav>
<div id="notice" class="notice hidden"><span>Assignment moved to Archive</span><button id="undo">↶ Undo</button></div>
<section id="listView"><div class="section-head"><h2 id="listTitle">Your assignments</h2><span id="count" class="count"></span></div><div id="tasks"></div></section>
<section id="addView" class="hidden"><h2 id="formTitle">New assignment</h2>
<form id="taskForm">
<label for="subject">Subject</label><select id="subject"></select>
<div class="inline" style="margin-top:9px"><input id="newSubject" placeholder="New subject..." maxlength="45"><button type="button" id="addSubject" class="outline">Add subject</button></div>
<label for="taskName">What do you need to do?</label><textarea id="taskName" placeholder="e.g. Study for APUSH test" required maxlength="500"></textarea>
<label>Due date</label><div class="seg"><button type="button" id="noDate" class="active">None</button><button type="button" id="yesDate">Choose date</button></div>
<div id="calendar" class="calendar hidden"><div class="cal-top"><button type="button" id="prevMonth" aria-label="Previous month">‹</button><strong id="monthLabel"></strong><button type="button" id="nextMonth" aria-label="Next month">›</button></div><div id="calGrid" class="cal-grid"></div><div id="chosenDate" class="chosen-date"></div></div>
<label for="nextAction">Next action required</label><textarea id="nextAction" placeholder="e.g. Take out Chromebook and open math packet" required maxlength="500"></textarea>
<div id="formError" class="error hidden"></div><button type="submit" id="saveTask" class="primary save">✓ Save assignment</button><button type="button" id="cancelEdit" class="outline save hidden">Cancel editing</button>
</form></section>
<footer><span>◈ School HQ · Web edition</span><span>Saved in this browser</span></footer>
</main>
<script>
(()=>{'use strict';
const KEY='school-hq-v1';
const defaults=['APUSH','APES','AP Pre-Calc','AP Lit','Spanish'];
const $=id=>document.getElementById(id);
let state;
try{const raw=JSON.parse(localStorage.getItem(KEY));state=raw&&Array.isArray(raw.tasks)&&Array.isArray(raw.subjects)?raw:null}catch(e){}
if(!state)state={tasks:[],subjects:[...defaults]};
let view='todo',expanded=null,confirmId=null,lastCompleted=null,dateMode='none',editingId=null,selectedDate=null;let shownMonth=new Date();shownMonth.setDate(1);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Your browser could not save these tasks. Check storage settings.');}}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function button(label,cls,fn){const b=el('button',cls,label);b.type='button';b.addEventListener('click',fn);return b}
function dueInfo(d){
if(!d)return {label:'No due date',status:'none'};
const date=new Date(d+'T12:00:00');
if(Number.isNaN(date.getTime()))return {label:d,status:'none'};
const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);
const diff=Math.round((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-Date.UTC(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
const formatted=date.toLocaleDateString('en-US',{month:'short',day:'numeric'});
if(diff<0)return {label:'⚠ Past due · '+(diff===-1?'Yesterday':formatted),status:'overdue'};
if(diff===0)return {label:'Due today',status:'today'};
if(diff===1)return {label:'Tomorrow',status:'soon'};
const daysUntilSunday=7-today.getDay()-1;
if(diff<=daysUntilSunday)return {label:date.toLocaleDateString('en-US',{weekday:'long'}),status:'week'};
return {label:formatted,status:'future'};
}
function selectSubject(prefer){const s=$('subject');s.replaceChildren();state.subjects.forEach(name=>{const o=el('option','',name);o.value=name;s.append(o)});if(prefer&&state.subjects.includes(prefer))s.value=prefer}
function navigate(v){if(v==='add'&&view!=='add')resetForm();view=v;expanded=null;confirmId=null;render()}
function resetForm(){$('taskForm').reset();editingId=null;selectedDate=null;setDateMode('none');$('formError').classList.add('hidden');selectSubject();}
function editTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;editingId=id;view='add';expanded=null;confirmId=null;$('taskName').value=t.name;$('nextAction').value=t.next;selectSubject(t.subject);selectedDate=t.due||null;setDateMode(t.due?'date':'none');if(t.due){const [y,m]=t.due.split('-').map(Number);shownMonth=new Date(y,m-1,1)}render()}
function renderCalendar(){const grid=$('calGrid');grid.replaceChildren();$('monthLabel').textContent=shownMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});['S','M','T','W','T','F','S'].forEach(d=>grid.append(el('span','cal-weekday',d)));const y=shownMonth.getFullYear(),m=shownMonth.getMonth(),offset=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<offset;i++)grid.append(el('span'));for(let day=1;day<=days;day++){const date=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');const b=button(String(day),date===selectedDate?'selected':'',()=>{selectedDate=date;renderCalendar()});b.setAttribute('aria-label',date);b.setAttribute('aria-pressed',String(date===selectedDate));grid.append(b)}$('chosenDate').textContent=selectedDate?'Selected: '+new Date(selectedDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'Select a date on the calendar'}
function render(){
$('todoTab').textContent='To-do ('+state.tasks.filter(t=>!t.done).length+')';
['todo','archive','add'].forEach(v=>$(v+'Tab').classList.toggle('active',view===v));
$('addTab').classList.toggle('outline',view!=='add');
$('listView').classList.toggle('hidden',view==='add');$('addView').classList.toggle('hidden',view!=='add');
$('notice').classList.toggle('hidden',view!=='todo'||lastCompleted===null);
if(view==='add'){$('formTitle').textContent=editingId===null?'New assignment':'Edit assignment';$('saveTask').textContent=editingId===null?'✓ Save assignment':'✓ Save changes';$('cancelEdit').classList.toggle('hidden',editingId===null);renderCalendar();return;}
$('listTitle').textContent=view==='todo'?'Your assignments':'Completed assignments';
const arr=state.tasks.filter(t=>t.done===(view==='archive')).sort((a,b)=>view==='archive'?(b.completedAt||0)-(a.completedAt||0):(!a.due&&!b.due?0:!a.due?1:!b.due?-1:a.due.localeCompare(b.due)));
$('count').textContent=arr.length+' '+(arr.length===1?'task':'tasks');
const holder=$('tasks');holder.replaceChildren();
if(!arr.length){const empty=el('div','empty');empty.append(el('b','',view==='todo'?'All clear!':'No archived assignments'),el('span','',view==='todo'?'Add an assignment to get started.':'Completed assignments will appear here.'));holder.append(empty);return}
arr.forEach(t=>{
const card=el('article','task');const head=button('','task-button',()=>{expanded=expanded===t.id?null:t.id;confirmId=null;render()});
const row=el('div','task-head');const left=el('div');const meta=el('div','meta');const info=dueInfo(t.due);meta.append(el('span','subject',t.subject),el('span',info.status==='overdue'?'due-overdue':info.status==='today'?'due-today':'',''+(info.status==='overdue'?'':'▦ ')+info.label));
left.append(meta,el('div','task-title',t.name));if(t.done)left.lastChild.style.textDecoration='line-through';
row.append(left,el('span','chevron',expanded===t.id?'⌃':'⌄'));head.append(row);card.append(head);
if(expanded===t.id){
const detail=el('div','details');const action=el('div','action');action.append(el('div','action-label','NEXT ACTION'),el('div','action-text','→ '+t.next));detail.append(action);
if(confirmId===t.id){const c=el('div','confirm');c.append(el('p','','Are you sure you finished this assignment?'));const controls=el('div','controls');controls.append(button('Yes, complete','primary',()=>{t.done=true;t.completedAt=Date.now();lastCompleted=t.id;expanded=null;confirmId=null;save();render()}),button('Cancel','outline',()=>{confirmId=null;render()}));c.append(controls);detail.append(c)}
else{const controls=el('div','controls');if(t.done)controls.append(button('↶ Restore to To-do','outline',()=>{t.done=false;t.completedAt=null;lastCompleted=null;expanded=null;save();render()}));
else controls.append(button('✓ Complete assignment','primary',()=>{confirmId=t.id;render()}));
if(!t.done)controls.append(button('✎ Edit','outline',()=>editTask(t.id)));detail.append(controls)}card.append(detail)}
holder.append(card)
});
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
$('undo').addEventListener('click',()=>{const t=state.tasks.find(t=>t.id===lastCompleted);if(t){t.done=false;t.completedAt=null;save()}lastCompleted=null;render()});
$('addSubject').addEventListener('click',()=>{const name=$('newSubject').value.trim();if(!name)return;const existing=state.subjects.find(s=>s.toLowerCase()===name.toLowerCase());if(!existing){state.subjects.push(name);save()}selectSubject(existing||name);$('newSubject').value=''});
function setDateMode(m){dateMode=m;$('noDate').classList.toggle('active',m==='none');$('yesDate').classList.toggle('active',m==='date');$('calendar').classList.toggle('hidden',m==='none');if(m==='date')renderCalendar()}
$('prevMonth').addEventListener('click',()=>{shownMonth.setMonth(shownMonth.getMonth()-1);renderCalendar()});$('nextMonth').addEventListener('click',()=>{shownMonth.setMonth(shownMonth.getMonth()+1);renderCalendar()});$('cancelEdit').addEventListener('click',()=>navigate('todo'));
$('noDate').addEventListener('click',()=>setDateMode('none'));$('yesDate').addEventListener('click',()=>setDateMode('date'));
$('taskForm').addEventListener('submit',e=>{e.preventDefault();const name=$('taskName').value.trim(),next=$('nextAction').value.trim(),due=dateMode==='date'?selectedDate:null;
if(!name||!next||(dateMode==='date'&&!due)){$('formError').textContent='Please enter an assignment, a next action, and a date if selected.';$('formError').classList.remove('hidden');return}
$('formError').classList.add('hidden');const id=Date.now()+'-'+Math.random().toString(36).slice(2);
if(editingId!==null){const t=state.tasks.find(x=>x.id===editingId);if(t){Object.assign(t,{subject:$('subject').value,name,next,due})}}else{state.tasks.push({id,subject:$('subject').value,name,next,due,done:false,createdAt:Date.now()})}const savedId=editingId===null?id:editingId;save();resetForm();lastCompleted=null;view='todo';expanded=savedId;confirmId=null;render()});
selectSubject();setDateMode('none');render();window.addEventListener('focus',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
})();
</script></body></html>
